; TEAM M021 - ESP32 pressure controller (PT-101 / PCV-101 / P-101)

[platformio]
; `pio run` without -e builds only the controller.
default_envs = esp32dev
; Versions are pinned so a rebuild in a year gives the same binary.
; espressif32 6.9.0 ships Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4.7):
; LEDC uses the 2.x API (ledcSetup / ledcAttachPin / ledcWrite / ledcDetachPin).

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Pinned explicitly as well (= Arduino-ESP32 2.0.17, verified after download).
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
monitor_speed = 115200
; Review m5: keep DTR/RTS released when the monitor opens the port, so the DevKit's
; auto-reset circuit does not reboot the controller (and drop RUN / the trip latch).
; Uploading is unaffected (esptool drives the lines itself).
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
; Review M2: no coredump partition, so a panic reboots without a flash write first.
board_build.partitions = partitions_nocoredump.csv
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1

; Minimal hardware bring-up firmware (bringup/bringup.cpp): GPIO26/27 LOW at boot, prints
; v_gpio_mv / P_mbar every 200 ms, serial p<N> v1 v0 s r, trip at 20 mbar(g).
; No Wi-Fi, ring buffer or NVS. It does NOT touch src/; the controller env is unchanged.
[env:bringup]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
; same partition table as the controller, so flashing either keeps the NVS area in place
board_build.partitions = partitions_nocoredump.csv
build_src_filter = -<*> +<../bringup/>
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
